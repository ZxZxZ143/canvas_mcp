[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-mcp"
version = "0.1.0"
description = "Read-only Canvas academic integration with normalized bounded queries"
requires-python = ">=3.11"
dependencies = ["httpcore[asyncio]>=1.0.9,<1.1", "mcp>=1.30,<2", "pyjwt[crypto]>=2.15,<3", "starlette>=1.3.1,<2", "uvicorn>=0.51,<1", "pypdf==6.19.0", "defusedxml==0.7.1", "Pillow==12.3.0", "pypdfium2==5.13.0", "pywin32>=306; sys_platform == 'win32'", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]
